# メイン導線の一覧。リポジトリの .github/main-flows.toml に置く。
# ここに載っている導線は、リリースの前に、人が一度通して見る（ux-walkthrough）。
# 点検: python3 <skill>/scripts/flows.py check
#
# 何をメイン導線にするかは人が決める。目安は、止まると売上や約束が止まる導線と、初めての人が必ず通る導線。

[[flow]]
id = "checkout"                    # 記録に使う名前。英小文字・数字・ハイフン。変えると未確認に戻る
title = "商品を買う（カートから完了の画面まで）"
persona = "初めて買う人。会員登録はしていない。スマホで見ている"
task = "1,200 円の商品を 1 つ買い、完了の画面で注文番号を控える"
start = "/cart"                    # 入り口（URL か、入り方）
# この導線の画面を作っているファイル。ここに一致するファイルの中身が変わると、未確認に戻る。
# glob は git の書き方（** は何階層でも）。1 つも一致しない時は、点検がエラーで止まる。
# 多くの導線が共有するファイル（翻訳の表、共通部品）を入れると、変更のたびに全部が未確認に戻る。
# 入れるかどうかは、通し直す手間と見落としの重さで決める。
paths = ["apps/web/app/checkout/**", "apps/web/app/routes/checkout*.tsx"]

[[flow]]
id = "refund"
title = "注文を返金する"
persona = "店の担当者。管理画面には慣れているが、返金は月に 1 回しかしない"
task = "昨日の 1,200 円の注文を、全額返金する"
start = "/orders"
paths = ["apps/admin/app/refund/**"]
