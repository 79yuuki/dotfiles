# merge-gate の設定。リポジトリの .github/merge-gate.toml に置く。
# 判定は、PR のブランチではなく base ブランチにある版を読む。
# .github/ 以下に触れる PR は、ここに書かなくても必ず low になる（判定の決まりと CI を、判定される変更が書き換えられないようにするため）。
# path の書き方: `*` は 1 階層の中の任意の文字列、`**` は階層をまたぐ任意の文字列、`?` は 1 文字。`[]` と `{}` は使えない。

# observe: 記録するだけ / advise: PR に書いて人に促す / enforce: high だけ人が読まずに入れてよい
stage = "observe"

[target]
# 判定の対象にする PR の題名の種別（conventional commits の type）。それ以外は対象外で low。
title_prefixes = ["fix"]

[simple]
# 「単純な変更」の大きさ。超えると上限が medium になる。size_ignore に当たるファイルは数えない。
max_files = 5
max_changed_lines = 150

[paths]
# 触れたら上限が low になる（人が読む）。モデルの評価では上がらない。
sensitive = [
  "**/migrations/**",
  "**/*.sql",
  "**/auth/**",
  "**/*.tf",
  "**/Dockerfile",
  "**/.env*",
  "**/package.json",      # 依存の追加と更新
  "**/pnpm-lock.yaml",    # lockfile だけの変更も、入る依存が変わる
  "**/package-lock.json",
]
# CODEOWNERS で持ち主のレビューを求めている path は、ここにも書く。
# テストのファイル。コードを変えてテストを変えていない PR は、上限が medium になる。
tests = ["**/*.spec.ts", "**/*.test.ts", "**/__tests__/**"]
# 大きさに数えないファイル。
size_ignore = ["**/*.snap", "**/*.md"]

# 判定役が証拠を実行し直す時の準備と実行のコマンド。スクリプトは読まない。判定役が読む。
# [run]
# setup = ["pnpm install --frozen-lockfile", "pnpm run build:schema"]
# test = "pnpm exec jest <spec のパス>"
# allowed_hosts = []   # 判定役が接続してよい外部のホスト。空なら、外部には接続しない

# 差分から読める引き金と、その時に確かめること。path では拾えない種類の変更を、ここで拾う。
# 過去の不具合から足し、効かなくなったら消す。
# [[checks]]
# when = ["**/payment/**"]
# ask = "金額の丸めと通貨の単位は、変更の前後で同じか"
#
# [[checks]]
# when = ["**/controllers/**"]
# ask = "認証や署名に使う値（origin、RP ID、challenge、鍵の指定）を変えていないか。変えていれば人に回す"
